# A label for a PR that changes the deck, tech info, test patterns or fixtures of one PDK only, for the
# categories of the release notes (.github/release.yml), which a label such as bug takes precedence over.
# Any other PR has no label of a PDK and goes under "All PDKs"
pdk-ihp:
  - all:
      - changed-files:
          - any-glob-to-any-file:
              - 'pdk/ihp-*/**'
              - 'scripts/gen_tech_pb/ihp_*.py'
              - 'scripts/gen_test_patterns/ihp_*.py'
              - 'testdata/designs/ihp-*/**'
              - 'testdata/lvsdb/ihp-*/**'
          - all-globs-to-all-files:
              - '!pdk/sky130A/**'
              - '!scripts/gen_tech_pb/sky130A.py'
              - '!scripts/gen_test_patterns/sky130A.py'
              - '!testdata/designs/sky130A/**'
              - '!testdata/lvsdb/sky130A/**'
              - '!pdk/gf180mcuD/**'
              - '!scripts/gen_tech_pb/gf180mcuD.py'
              - '!scripts/gen_test_patterns/gf180mcuD.py'
              - '!testdata/designs/gf180mcuD/**'
              - '!testdata/lvsdb/gf180mcuD/**'
