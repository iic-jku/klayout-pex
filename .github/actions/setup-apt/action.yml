name: Configure Ubuntu package downloads
description: Add independent mirrors and bound APT network retries
runs:
  using: composite
  steps:
    - name: Configure authenticated APT mirror fallback
      shell: bash
      env:
        SETUP_APT_ACTION_PATH: ${{ github.action_path }}
      run: sudo python3 "$SETUP_APT_ACTION_PATH/configure_apt.py"
