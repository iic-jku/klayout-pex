name: "Publish test/coverage/lint reports to GitHub Pages"

on:
  workflow_call:
  
# NOTE: concurrency settings must be defined in calling workflow!
#       otherwise unexpected cancellations will happen
#   example error: "Canceling since a higher priority waiting request for 'martinjankoehler/klayout-pex-release-v0.1.4-Multi-platform Python build/test' exists"

jobs:
  allure-report:
    name: "Generate Allure Report (Aggregated Suites)"
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7

      # NOTE: actions/download-artifact@v8 now has merging functionality built in => no need for actions/upload-artifact/merge@v4
      # - name: "Merge test results (Allure)"
      #   uses: actions/upload-artifact/merge@v4
      #   with:
      #     name: merged-allure-reports
      #     pattern: python-*-tests-allure-report-ubuntu*
      #     # delete-merged: true
      #     retention-days: 1

      - name: "Download and merge Allure coverage artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: python-*-tests-allure-report-*
          merge-multiple: true
          path: build/allure-results   # destination

      - name: "Set up JDK (for Allure)"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: 17

      - name: "Load test report history (Allure)"
        uses: actions/checkout@v7
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # NOTE: the Allure CLI on the JDK above, like simple-elf/allure-report-action did, whose Docker build
      #       pulls its base image from public.ecr.aws, which rate-limits the GitHub runners (429 Too Many Requests)
      - name: "Build test report"
        if: always()
        env:
          ALLURE_RELEASE: "2.44.0"
          PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure"
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          curl -fsSL -o allure.tgz \
            "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/${ALLURE_RELEASE}/allure-commandline-${ALLURE_RELEASE}.tgz"
          tar -xzf allure.tgz

          # the trend of the previous reports, from the gh-pages checkout
          mkdir -p build/allure-results/history
          cp -r gh-pages/allure/last-history/. build/allure-results/history || echo "No report history on gh-pages"
          cat > build/allure-results/executor.json <<EOF
          {"name": "GitHub Actions", "type": "github", "reportName": "Allure Report with history",
           "url": "${PAGES_URL}", "reportUrl": "${PAGES_URL}/${RUN_NUMBER}",
           "buildUrl": "${RUN_URL}", "buildName": "GitHub Actions Run #${RUN_NUMBER}", "buildOrder": "${RUN_NUMBER}"}
          EOF

          "allure-${ALLURE_RELEASE}/bin/allure" generate --clean build/allure-results -o allure-report

          # the layout of gh-pages: allure/<run number>/, allure/last-history/, allure/index.html to the latest
          mkdir -p allure-history/allure
          cp -r allure-report/. "allure-history/allure/${RUN_NUMBER}"
          cp -r allure-report/history/. allure-history/allure/last-history
          echo "<!DOCTYPE html><meta charset=\"utf-8\"><meta http-equiv=\"refresh\" content=\"0; URL=${PAGES_URL}/${RUN_NUMBER}/index.html\">" \
            > allure-history/allure/index.html
          echo "<meta http-equiv=\"Pragma\" content=\"no-cache\"><meta http-equiv=\"Expires\" content=\"0\">" \
            >> allure-history/allure/index.html

      - name: "Publish test report"
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          destination_dir: ./
          # destination_dir: ./allure
          keep_files: true

  merge-coverage-reports:
    name: "Generate Coverage Report (Aggregated Suites)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "[🐍] Download and merge 📦 artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: python-dist-ubuntu-latest* 
          merge-multiple: true
          path: dist   # destination

      - name: "[🐍] Unpack Source 📦"
        run: |
          tar xvfz dist/klayout_pex*.tar.gz --strip-components=1

      # NOTE: the paths ci-cd.yml's plugin tests ran from, for the plugins' sources;
      #       a plugin that can't be cloned did not run its tests either
      - name: "Checkout plugins"
        run: |
          for plugin in gmsh palace elmer; do
            git clone --depth 1 "https://github.com/iic-jku/klayout-pex-plugin-$plugin.git" \
                      "plugins/klayout-pex-plugin-$plugin" \
              || echo "::warning::Could not clone klayout-pex-plugin-$plugin"
          done

      - name: "[🐍] Download and merge coverage artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: python-*-tests-coverage-report-ubuntu-*
          merge-multiple: false
          path: pycov-databases   # destination

      - name: "Display structure of downloaded files"
        run: ls -R pycov-databases

      - name: "Print current working directory"
        run: pwd

      - name: "[🐍] Setup python"
        id: setup-python
        uses: actions/setup-python@v7

      - name: "[🐍] Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install coverage
          
      - name: "[🐍] Combine coverage reports"
        run: |
          coverage combine pycov-databases/*/python-coverage.sqlite

      - name: "[🐍] Create HTML coverage report"
        run: >
          coverage html 
          --directory pycov 
          --data-file=.coverage
          --omit="build/python/klayout_pex_protobuf/*_pb2.py"

      - name: "Display structure of coverage report"
        run: ls -R pycov

      - name: "[🐍] Store merged coverage reports"
        if: success() || failure()
        uses: actions/upload-artifact@v6
        with:
          name: merged-coverage-report
          path: pycov
          retention-days: 1
          if-no-files-found: error

  publish-coverage-reports:
    name: "Publish Coverage Report (Aggregated Suites)"
    runs-on: ubuntu-latest
    needs: merge-coverage-reports
    steps:
      - name: "Download merged coverage artifact"
        uses: actions/download-artifact@v8
        with:
          name: merged-coverage-report
          path: pycov   # destination
    
      - name: "Publish coverage reports"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: pycov
          destination_dir: pycov
          keep_files: true
