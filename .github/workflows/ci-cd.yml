name: Multi-platform Python build/test

on:
  push:
    branches: [ "main", "next_release" ]
    paths-ignore:
       - '.gitignore'
       - '**.md'
       - '*.sh'
  pull_request:
    branches: [ "main", "next_release" ]
    paths-ignore:
       - '.gitignore'
       - '**.md'
       - '*.sh'
  workflow_call:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.repository }}-${{ github.event.number || github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build/Test ${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. 
      # Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12']

    env:
      ALLURE_RESULTS_PATH: build/allure-results
      COVERAGE_DATA_PATH: build/python-coverage.sqlite

    steps:
    - uses: actions/checkout@v7

    - name: "[🐍] Setup python ${{ matrix.python-version }}"
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: "[🐍] Install Poetry"
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
        virtualenvs-path: .venv
        installer-parallel: true

    - name: "[🐍] Check version"
      if: ${{ github.event.release }}
      run: |
        version=$(poetry version | awk '{print $2}')
        tag=$(echo "${{ github.ref }}" | awk '{split($0,p,"/"); print p[3]}')
        if [ "v$version" != $tag ]; then echo "Release tag ('$tag') and poetry version ('v$version') do not match!"; exit 1; fi;
      shell: bash
    
    - name: "[🐍] Load cached venv"
      id: cached-poetry-dependencies
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: "[🐍] Install dependencies"
      run: poetry install --no-interaction --no-root
      shell: bash    # NOTE: required for windows poetry calls

    # NOTE: the same steps as gen_tech_pb.sh
    - name: "[🐍] Generate protobuf python modules"
      run: >
        poetry run python -m grpc_tools.protoc
        --proto_path=protos
        --python_out=klayout_pex_protobuf
        $(find protos -name '*.proto')
      shell: bash    # NOTE: required for windows poetry calls

    - name: "[🐍] Verify python protobuf generation"
      run: |
        # check if protobuf python modules were created
        ls klayout_pex_protobuf/kpex/tech/tech_pb2.py
      shell: bash

    - name: "[🐍] Generate PB Tech"
      run: poetry run python scripts/gen_tech_pb klayout_pex_protobuf
      shell: bash    # NOTE: required for windows poetry calls

    - name: "[🐍] Install project"
      run: poetry install --no-interaction
      shell: bash    # NOTE: required for windows poetry calls

    - name: "[🐍] Build wheel and source archives"
      run: poetry build --output dist
      shell: bash    # NOTE: required for windows poetry calls

    - name: "[🐍] Verify wheel contains generation tech protobuf json messages"
      run: |
        unzip -l dist/*.whl | grep klayout_pex_protobuf | grep .pb.json
      shell: bash

    - name: "[🐍] Verify wheel contains generation protobuf python modules"
      run: |
        unzip -l dist/*.whl | grep klayout_pex_protobuf | grep _pb2.py
      shell: bash

    # NOTE: see scripts/build/kpex_build_backend.py and issue #210
    - name: "[🐍] Verify wheel and sdist contain the symlinked PDK files as regular files"
      run: python scripts/build/verify_dist.py dist
      shell: bash

    - name: "[🐍] Store dist artifact"
      uses: actions/upload-artifact@v6
      with:
        name: python-dist-${{ matrix.os }}_py${{ matrix.python-version }}
        path: dist
        retention-days: 7
        if-no-files-found: error

    - name: "[🐍] Run Unit tests"
      run: >
        poetry run coverage run --data-file=${{ env.COVERAGE_DATA_PATH }} -m pytest -m "not slow and not smoke"
        --alluredir ${{ env.ALLURE_RESULTS_PATH }}
        --color no 
      shell: bash    # NOTE: required for windows poetry calls

    - run: pwd

    - run: ls -aR

    - name: "[🐍] Store coverage results"
      if: success() || failure()
      uses: actions/upload-artifact@v6
      with:
        name: python-unit-tests-coverage-report-${{ matrix.os }}_py${{ matrix.python-version }}
        path: ${{ env.COVERAGE_DATA_PATH }}   # NOTE: pytest-cov coverage binary file, can be combined later!
        retention-days: 1
        if-no-files-found: error

    - name: "[🐍] Store allure test results"
      if: success() || failure()
      uses: actions/upload-artifact@v6
      with:
        name: python-unit-tests-allure-report-${{ matrix.os }}_py${{ matrix.python-version }}
        path: ${{ env.ALLURE_RESULTS_PATH }}
        retention-days: 1
        if-no-files-found: error

  # The plugin repositories' tests, against this checkout rather than the klayout-pex
  # release they pin: a change that breaks a plugin fails here. Their results join
  # the Allure and coverage pages.
  plugin-tests:
    name: Plugin Tests ${{ matrix.plugin }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        plugin: [gmsh, palace, elmer]

    env:
      ALLURE_RESULTS_PATH: build/allure-results
      COVERAGE_DATA_PATH: build/python-coverage.sqlite

    steps:
    - uses: actions/checkout@v7

    - name: "[🐍] Setup python"
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: "[🐍] Install Poetry"
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
        virtualenvs-path: .venv
        installer-parallel: true

    # NOTE: a key of its own: this venv also holds the plugins, whose entry points
    #       would show up in klayout-pex's own tests
    - name: "[🐍] Load cached venv"
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-plugin-tests-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: "[🐍] Install dependencies"
      run: poetry install --no-interaction --no-root

    # NOTE: the same steps as gen_tech_pb.sh
    - name: "[🐍] Generate protobuf python modules"
      run: >
        poetry run python -m grpc_tools.protoc
        --proto_path=protos
        --python_out=klayout_pex_protobuf
        $(find protos -name '*.proto')

    - name: "[🐍] Generate PB Tech"
      run: poetry run python scripts/gen_tech_pb klayout_pex_protobuf

    - name: "[🐍] Install project"
      run: poetry install --no-interaction

    # NOTE: the same paths as in publish-reports-github-pages.yml, which needs
    #       the sources for the coverage report
    - name: "Checkout plugins"
      run: |
        for plugin in gmsh palace elmer; do
          git clone --depth 1 "https://github.com/iic-jku/klayout-pex-plugin-$plugin.git" \
                    "plugins/klayout-pex-plugin-$plugin"
        done

    # NOTE: the gmsh wheel links against these
    - name: "Install gmsh's system libraries"
      run: |
        sudo apt-get update
        sudo apt-get install --yes libgl1 libglu1-mesa libgomp1 libxcursor1 libxft2 libxinerama1 libxrender1

    # --no-deps: keep this checkout of klayout-pex, whatever release the plugins pin
    - name: "[🐍] Install plugins"
      run: |
        poetry run pip install gmsh
        poetry run pip install --no-deps \
          -e plugins/klayout-pex-plugin-gmsh \
          -e plugins/klayout-pex-plugin-palace \
          -e plugins/klayout-pex-plugin-elmer

    - name: "Install Elmer FEM"
      if: matrix.plugin == 'elmer'
      run: |
        sudo add-apt-repository --yes ppa:elmer-csc-ubuntu/elmer-csc-ppa
        sudo apt-get update
        sudo apt-get install --yes elmerfem-csc

    - name: "[🐍] Run plugin tests"
      run: >
        poetry run coverage run --data-file=${{ env.COVERAGE_DATA_PATH }}
        -m pytest plugins/klayout-pex-plugin-${{ matrix.plugin }}
        --alluredir ${{ env.ALLURE_RESULTS_PATH }}
        --color no
        -rA

    - name: "[🐍] Store coverage results"
      if: success() || failure()
      uses: actions/upload-artifact@v6
      with:
        name: python-plugin-${{ matrix.plugin }}-tests-coverage-report-ubuntu-latest_py3.12
        path: ${{ env.COVERAGE_DATA_PATH }}
        retention-days: 1
        if-no-files-found: error

    - name: "[🐍] Store allure test results"
      if: success() || failure()
      uses: actions/upload-artifact@v6
      with:
        name: python-plugin-${{ matrix.plugin }}-tests-allure-report-ubuntu-latest_py3.12
        path: ${{ env.ALLURE_RESULTS_PATH }}
        retention-days: 1
        if-no-files-found: error

  call-smoke-tests:
    name: "Smoke Tests"
    needs: build_and_test
    concurrency:
      group: ${{ github.repository }}-${{ github.event.number || github.head_ref || github.sha }}-${{ github.workflow }}-smoke-tests
      cancel-in-progress: true
    uses: ./.github/workflows/smoke-tests.yml

  call-publish-pypi:
    name: "Publish distribution 📦s to PyPI/TestPyPI"
    # NOTE: don't publish a wheel that fails for any bundled PDK (#210)
    needs: [build_and_test, call-smoke-tests]
    concurrency:
      group: ${{ github.repository }}-${{ github.event.number || github.head_ref || github.sha }}-${{ github.workflow }}-publish-pypi
      cancel-in-progress: true
    uses: ./.github/workflows/publish-pypi.yml

  call-integration-tests:
    name: "Integration Tests"
    needs: build_and_test
    concurrency:
      group: ${{ github.repository }}-${{ github.event.number || github.head_ref || github.sha }}-${{ github.workflow }}-integration-tests
      cancel-in-progress: true
    uses: ./.github/workflows/integration-tests.yml

  # NOTE: after every suite, so that each one's results are in the reports;
  #       also when some failed, which is what the reports are for
  call-publish-reports-github-pages:
    name: "Publish reports to GitHub Pages"
    needs: [build_and_test, call-smoke-tests, call-integration-tests, plugin-tests]
    if: ${{ !cancelled() }}
    concurrency:
      group: ${{ github.repository }}-${{ github.event.number || github.head_ref || github.sha }}-${{ github.workflow }}-publish-reports-github-pages
      cancel-in-progress: true
    uses: ./.github/workflows/publish-reports-github-pages.yml
