// Mandatory format capabilities shared by PEX25D files and resolved scenes.
syntax = "proto3";
package kpex.pex25d;

// Every consumer must reject unknown required capabilities before using an artifact.
enum RequiredCapability {
    REQUIRED_CAPABILITY_UNSPECIFIED = 0;
    REQUIRED_CAPABILITY_CAPACITANCE_ACCOUNTING = 10;
}
