//
// Validator output for PEX25D files: coded, positioned diagnostics that other
// tools can consume without parsing human-readable message text.
//
syntax = "proto3";

package kpex.pex25d;

import "kpex/pex25d/pex25d_source_ref.proto";

// Machine-readable validator output. The stable `code` is what lets other
// readers groups test their PEX25D *writers* against the reference
// validator without depending on kpex internals or on message wording.
message Diagnostic {
    enum Severity {
        SEVERITY_UNSPECIFIED = 0;
        SEVERITY_NOTE = 1;
        SEVERITY_WARNING = 2;
        SEVERITY_ERROR = 3;
    }

    enum Tier {
        TIER_UNSPECIFIED = 0;
        TIER_SYNTAX = 1;     // arity, clause order, literal not a grid multiple,
                             // unrecognized top-level record (a WARNING, per
                             // the version-compatibility rules; an unknown
                             // clause keyword inside a record is an ERROR)
        TIER_SEMANTIC = 2;   // name resolution, acyclic WRAPS, depth ties, ...
        TIER_GEOMETRIC = 3;  // ring simplicity, hole containment, overlap (--strict)
    }

    string code = 1;  // stable identifier, e.g. "PEX25D-E0203"
    Severity severity = 2;
    Tier tier = 3;
    string message = 4;

    SourceRef source = 100;

    // Additional positions, e.g. the earlier declaration of a duplicate name,
    // or the other member of a same-depth WRAPS tie.
    repeated SourceRef related = 101;
}

message DiagnosticList {
    repeated Diagnostic diagnostics = 1;
}
