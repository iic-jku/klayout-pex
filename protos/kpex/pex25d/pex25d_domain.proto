//
// Optional computational-domain settings for a PEX25D file.
//
// DOMAIN_MARGIN and DOMAIN_BOX are solver-adapter *hints* for selecting a
// finite computational region. Neither prescribes a boundary condition; each
// solver adapter applies its native open-domain treatment. DOMAIN_BOX takes
// precedence when both are present.
//
// "FINITE GEOMETRY" throughout this file means the solids that are BOUNDED IN
// XY: the conductor shapes, and the conformal films grown on them whose
// `thickness_on_field` is zero. The ground plane, the background, every
// DIELECTRIC_SIMPLE band and every conformal with a non-zero
// `thickness_on_field` are laterally unbounded — they take no part in the
// bounding box and are simply clipped to whatever domain the adapter settles
// on. A METAL declared without shapes has no solid and likewise takes no part,
// so an anchor profile lying below the domain's lower face is neither a
// DOMAIN_BOX violation nor a reason to enlarge the margin box.
//
// Note that a conformal film with `thickness_on_field` 0 DOES push the box out
// past its conductor by `thickness_beside_wrapped` — small against a typical
// margin, but it is the difference between a rule an adapter can apply and one
// it has to guess at.
//
syntax = "proto3";

package kpex.pex25d;

import "kpex/pex25d/pex25d_source_ref.proto";
import "kpex/pex25d/pex25d_geometry.proto";

// `DOMAIN_MARGIN X <x> Y <y> Z <z>`
//
// Minimum clearance from all finite geometry to the outer computational
// boundary. X/Y expand the finite bounding box in -X/+X/-Y/+Y; Z expands only
// above the highest finite geometry, because the ground plane forms the lower
// boundary. An adapter may increase these margins but must not use smaller
// ones. This is a hint: it prescribes no boundary condition, and each adapter
// applies its native open-domain treatment.
message DomainMargin {
    int64 x = 1;  // grid units
    int64 y = 2;  // grid units
    int64 z = 3;  // grid units
}

// `DOMAIN_BOX LL <x> <y> <z> UR <x> <y> <z>`
//
// Explicit outer box; takes precedence over DOMAIN_MARGIN. All finite
// non-ground-plane geometry must lie WITHIN it — faces may touch it. The
// box's lower Z face normally coincides with the ground plane's zhigh.
message DomainBox {
    Box3D box = 1;

    SourceRef source = 100;
}
