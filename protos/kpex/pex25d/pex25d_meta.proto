//
// The META statements of a PEX25D file.
//
syntax = "proto3";

package kpex.pex25d;

import "kpex/pex25d/pex25d_source_ref.proto";

// `META <key> <value>` — kept as an ordered list of opaque key/value pairs so
// that unknown keys survive a read/write round trip.
//
// META is informational ONLY: it must not change how any geometry or material
// is interpreted, and a reader ignoring every META record must produce exactly
// the same scene as one reading them all. Unknown keys are ignored silently —
// unlike an unknown top-level record, which warns.
//
// A key appears at most ONCE across the file and everything it INCLUDEs. A
// repeat is an error whether the values agree or not: record order is not
// significant, so "last one wins" would have no meaning. This list is
// therefore effectively a map; it stays repeated to keep ordering and a
// SourceRef per entry.
//
// Keys defined by the specification: technology, process_corner, source_cell,
// source_layout_hash, generator. Private keys are prefixed "x-<vendor>-".
message Meta {
    string key = 1;
    string value = 2;

    SourceRef source = 100;
}
