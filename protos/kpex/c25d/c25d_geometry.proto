//
// Shape types for the C25D (Capacitance Solver 2.5D) format.
// See https://github.com/iic-jku/klayout-pex/issues/184
//
// All coordinates are int64 grid units. The grid itself is declared once per
// file by kpex.c25d.Units, in c25d_units.proto.
//
// These deliberately do not reuse kpex.geometry.{Box,Polygon}:
//   * kpex.geometry.Polygon has only `hull_points` and cannot express the
//     HOLE rings that C25D POLYGON records carry;
//   * kpex.geometry.Box/Polygon carry a `net` property, whereas in C25D the
//     net lives on the CONDUCTOR the shape belongs to, never on the shape.
// If holes are added to kpex.geometry.Polygon later, Polygon2D can be
// replaced by it; the conversion is mechanical.
//
syntax = "proto3";

package kpex.c25d;

message Point2D {
    int64 x = 1;  // grid units
    int64 y = 2;  // grid units
}

message Point3D {
    int64 x = 1;  // grid units
    int64 y = 2;  // grid units
    int64 z = 3;  // grid units
}

// `LL <x> <y> UR <x> <y>`
message Box2D {
    Point2D lower_left = 1;
    Point2D upper_right = 2;
}

// `LL <x> <y> <z> UR <x> <y> <z>`
message Box3D {
    Point3D lower_left = 1;
    Point3D upper_right = 2;
}

// One closed ring. Implicitly closed: the first vertex is NOT repeated at the
// end. Must be simple (non-self-intersecting). Winding is not significant;
// readers may normalize it.
message Ring {
    repeated Point2D points = 1;
}

// `OUTER <x1> <y1> ... [HOLE <x1> <y1> ...]`
//
// Each hole must lie strictly inside `outer` and must not intersect or touch
// any other ring. Disconnected regions, and islands inside holes, are separate
// Polygon2D records.
message Polygon2D {
    Ring outer = 1;
    repeated Ring holes = 2;
}
