syntax = "proto3";
package kpex.calibration.v1;

// Read-only schema for saved version-1 evidence. New artifacts use the current schema.

import "kpex/calibration/preparation.proto";
import "kpex/result/capacitance_matrix.proto";
import "kpex/result/solver_execution.proto";

// FasterCap controls are backend-specific, not universal accuracy settings.
message FasterCapControls {
    // Automatic mode: finite relative stopping tolerance, strictly between 0 and 1.
    // Cannot coexist with manual mesh_refinement / gmres_tolerance.
    optional double automatic_tolerance = 1;
    // Manual mode: both fields are required. Refinement is positive; GMRES is in (0, 1).
    optional double mesh_refinement = 10;
    optional double gmres_tolerance = 20;
    // FasterCap -d: direct potential interaction coefficient / mesh refinement, > 0.
    double interaction_ratio = 30;
    // Initial triangulation, independent of adaptive refinement; 0 leaves area to the mesher.
    double mesh_max_area_um2 = 40;
    // Requested minimum initial triangle angle in degrees; converted to b = 2 sin(angle).
    // In [0, degrees(asin(1.1 / 2))], preserving the mesher quality limit.
    double mesh_min_angle_deg = 50;
}
message CalibrationSolveOptions {
    // Maximum concurrent solver processes, 1..32; not a memory limit.
    uint32 jobs = 1;
    // Requested child OpenMP/numerical-library threads, 1..256; build-dependent.
    uint32 threads_per_job = 10;
    // Positive finite wall-clock deadline per solver process, excluding queueing and export.
    double solver_timeout_seconds = 20;
    FasterCapControls fastercap = 30;
}

// Immutable index written before execution. Each case checkpoint is durable
// independently, so collection does not depend on a successful batch ending.
message CalibrationRunManifest {
    uint32 schema_version = 1;
    string kpex_version = 10;
    CalibrationArtifactReference preparation = 20;
    kpex.result.SolverIdentity solver = 30;
    CalibrationSolveOptions options = 40;
    repeated CalibrationRunCase cases = 50;
}
message CalibrationRunCase {
    string case_id = 1;
    string checkpoint_path = 10;
    string log_path = 20;
    string primary_input_path = 30;
    repeated CalibrationArtifactReference inputs = 40;
    // Empty for console-only saved runs. A requested report must never fall back to the log.
    string numerical_report_path = 50;
}
message CalibrationRunCheckpoint {
    uint32 schema_version = 1;
    string case_id = 10;
    kpex.result.SolverExecution execution = 20;
    CalibrationArtifactReference log = 30;
    // Native FasterCap JSON, including failed/partial output, retained byte-for-byte.
    CalibrationArtifactReference numerical_report = 40;
}
// Present only after every scheduled process has reached a terminal state.
// A finished batch may still contain failed processes or invalid matrices.
message CalibrationRunCompletion {
    uint32 schema_version = 1;
    CalibrationArtifactReference manifest = 10;
    repeated CalibrationArtifactReference checkpoints = 20;
}

message CalibrationCollection {
    uint32 schema_version = 1;
    CalibrationArtifactReference run_manifest = 10;
    bool execution_complete = 20;
    repeated CalibrationCaseResult cases = 30;
    // Includes copied input/provenance, checkpoints, raw logs and native reports, excluding this file.
    repeated CalibrationArtifactReference artifacts = 40;
}
message CalibrationCaseResult {
    string case_id = 1;
    enum CollectionStatus {
        STATUS_UNSPECIFIED = 0;
        COLLECTED = 1; // Parsed raw evidence only; numerical qualification has not run.
        INCOMPLETE = 2;
        EXECUTION_FAILED = 3;
        INVALID_RESULT = 4;
    }
    CollectionStatus status = 10;
    kpex.result.SolverExecution execution = 20;
    kpex.result.MaxwellCapacitanceMatrix native_matrix = 30;
    kpex.result.MaxwellCapacitanceMatrix measured_matrix = 40;
    repeated string diagnostics = 50;
    // Missing native statistics stay absent, rather than becoming zero counts.
    optional uint64 input_panels = 60;
    optional uint64 refined_panels = 70;
    optional uint64 potential_estimates = 80;
    optional uint64 links = 90;
}
