syntax = "proto3";
package kpex.result;

message SolverIdentity {
    string name = 1;
    string version = 10;
    string executable_sha256 = 20;
    string executable_path = 30; // Informational only; never executed by a saved-result reader.
    string operating_system = 40;
    string architecture = 50;
    string operating_system_release = 60;
}

message SolverExecution {
    enum Status {
        STATUS_UNSPECIFIED = 0;
        NOT_STARTED = 1;
        RUNNING = 2;
        SUCCEEDED = 3; // Process exited zero; does not imply valid or converged results.
        FAILED = 4;
        TIMED_OUT = 5;
        CANCELLED = 6;
    }
    Status status = 1;
    repeated string arguments = 10;
    optional int32 return_code = 20;
    double duration_seconds = 30;
    map<string, string> controlled_environment = 40;
    string diagnostic = 50;
}
