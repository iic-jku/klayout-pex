syntax = "proto3";
package kpex.result;

// Electrical data shared by field solvers and saved-result consumers.
message MaxwellCapacitanceMatrix {
    enum CapacitanceUnit {
        UNIT_UNSPECIFIED = 0;
        FARAD = 1;
    }
    CapacitanceUnit unit = 1;
    // The index convention below determines which axis represents charge/excitation.
    // Unexcited listed conductors are held at zero volts.
    repeated string conductor_ids = 10;
    message Row { repeated double values = 1; }
    repeated Row rows = 20;
    // Empty for a derived matrix; otherwise the backend labels in native order.
    repeated string native_labels = 30;
    enum ReferenceConvention {
        REFERENCE_UNSPECIFIED = 0;
        POTENTIAL_AT_INFINITY = 1;
        GROUNDED_PRINCIPAL_SUBMATRIX = 2;
    }
    ReferenceConvention reference_convention = 40;
    // Explicitly grounded finite bodies omitted from a principal submatrix.
    // This is not floating-conductor elimination or a change of reference.
    repeated string grounded_conductor_ids = 50;
    double reference_potential_v = 60;
    // Present for backend values converted to SI; original log/report bytes are retained.
    optional double source_value_scale_to_farads = 70;
    enum IndexConvention {
        INDEX_CONVENTION_UNSPECIFIED = 0;
        CHARGE_ROWS = 1; // Q_i = sum_j C_ij V_j
        EXCITATION_ROWS = 2; // Q_i = sum_j C_ji V_j, FasterCap's native row order
    }
    // Explicit for new collections, including a principal selection. No transposition,
    // symmetrization or clipping is implicit in collection.
    IndexConvention index_convention = 80;
}
