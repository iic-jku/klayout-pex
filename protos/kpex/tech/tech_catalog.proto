syntax = "proto3";

package kpex.tech;

import "kpex/tech/device_models.proto";
import "kpex/tech/process_parasitics.proto";
import "kpex/tech/process_stack.proto";

// A package of explicit scenarios, independent of transistor-model corner names.
// Technology remains unchanged so older readers can use the nominal legacy file.
message TechnologyCatalog {
    uint32 schema_version = 1; // Currently 1; reject unknown versions rather than guess.
    string technology_id = 2;
    string default_scenario = 3;
    TechnologyFile shared = 4; // Technology without stack, parasitics or device references.
    repeated TechnologyDatasetFile datasets = 5;
    repeated TechnologyScenario scenarios = 6;
}

message TechnologyFile {
    string path = 1; // Relative to the catalog, with forward slashes, within its directory.
    string sha256 = 2; // SHA256 of the exact file bytes, independent of semantic identities.
}

message TechnologyDatasetFile {
    // IDs are scoped by kind, opaque and case-sensitive. No meaning is inferred from names.
    string id = 1;
    enum Kind {
        KIND_UNSPECIFIED = 0;
        RESISTANCE = 1;
        CAPACITANCE = 2;
        PROCESS_STACK = 3;
        DEVICE_REFERENCES = 4;
    }
    Kind kind = 2;
    TechnologyFile file = 3;
}

message TechnologyScenario {
    string id = 1;
    string description = 2;
    string resistance = 10;
    string capacitance = 11;
    string process_stack = 12;
    // Empty means unavailable. Never inherit the default scenario's device references.
    string device_references = 13;
    // True only when the selected physical recipe represents this scenario, not merely
    // a nominal structural mapping usable by the analytical extractor.
    bool physical_stack_matches = 20;
}

message TechnologyDataset {
    string id = 1;
    // Traceable source or recipe, and assumptions not encoded in the numerical payload.
    string source = 2;
    string description = 3;
    oneof data {
        ResistanceInfo resistance = 10;
        CapacitanceDataset capacitance = 11;
        ProcessStackInfo process_stack = 12;
        DeviceReferenceDataset device_references = 13;
    }
}

message CapacitanceDataset {
    double side_halo = 1; // µm; belongs to the coefficient model, not to the physical stack.
    CapacitanceInfo capacitance = 2;
}

message DeviceReferenceDataset {
    repeated DeviceCapacitanceReferences devices = 1;
}

message DeviceCapacitanceReferences {
    string lvs_device_class_name = 1;
    repeated DeviceCapacitanceModel capacitance_references = 2;
}
