syntax = "proto3";

package kpex.tech;

// How KPEX writes the devices of the LVS netlist into the extracted netlist,
// so that the simulation models of the PDK accept them.
//
// KLayout's SPICE writer only knows its own device classes and their standard parameters.
// The devices of a PDK often differ:
//   - a subcircuit instead of a primitive model (e.g. sky130A MOS, IHP MOS, resistors and capacitors)
//   - other parameter names (e.g. gf180mcuD resistors r_width, r_length)
//   - other units (e.g. sky130A µm, as its models set .option scale=1.0u)
//   - a device class only LVS knows (e.g. IHP rfnmos is sg13_lv_nmos with rfmode=1)
//
// A device of the extracted netlist whose LVS device class has no DeviceModelMapping is an error.
message DeviceModelsInfo {
    repeated DeviceModelMapping device_model_mappings = 10;
}

message DeviceModelMapping {
    enum Kind {
        // e.g. a MOS, a diode, or a MOS capacitor (or varactor), whose capacitance the extraction doesn't have
        KIND_UNSPECIFIED = 0;

        // a capacitor of metal plates or fingers (e.g. a MIM or MOM cap), whose capacitance the extraction has
        // from its geometry, so that white-box mode (--blackbox n) removes it from the netlist.
        //
        //     NOTE: the LVS device class doesn't tell, e.g. sky130A reads VPP caps with 4 terminals as MOS4
        KIND_METAL_CAPACITOR = 1;
    }

    // name of the LVS device class, e.g. "rfnmos"
    string lvs_device_class_name = 1;

    Kind kind = 2;

    // SPICE instance prefix, e.g. "X" for a subcircuit, "M" for a MOS model
    string spice_prefix = 10;

    // name of the model or subcircuit, e.g. "sg13_lv_nmos",
    // the LVS device class name if empty
    string model_name = 20;

    // LVS terminal names, in the order of the model's ports, e.g. ["D", "G", "S", "B"]
    repeated string terminal_names = 30;

    // parameters of the model, in the written order
    // (LVS parameters that aren't listed are not written)
    repeated DeviceModelParameter parameters = 40;
}

message DeviceModelParameter {
    // name of the model parameter, e.g. "w"
    string name = 1;

    oneof value {
        // value of this LVS parameter, times lvs_parameter_factor
        string lvs_parameter_name = 10;

        // fixed value, e.g. rfmode=1
        double constant = 11;

        // side of the rectangle with the area and perimeter of these LVS parameters, times lvs_parameter_factor
        // (e.g. w and l of the IHP antenna diodes, which LVS extracts by area and perimeter)
        LVSAreaPerimeterSide lvs_area_perimeter_side = 12;
    }

    // factor from the LVS parameter value (as the device class stores it) to the value the model expects,
    // 1 if not set.
    //
    //     NOTE: the SI scaling of a device class parameter is not reliable for this,
    //           e.g. the IHP device classes store w in µm but declare an SI scaling of 1.
    //           Also, the written value is a plain number (no SPICE suffix like "u"),
    //           so that other netlist formats can write it too.
    //
    // e.g. IHP w (µm) to SI (m): 1e-6, sky130A W (µm) to µm: 1
    optional double lvs_parameter_factor = 20;
}

// A side of the rectangle with the area and perimeter of a device,
// for a model that takes w and l, where LVS extracts area and perimeter.
//
//     NOTE: only for a model that is symmetric in w and l, i.e. depends on w*l and w+l only
//           (e.g. a diode or MIM cap). Area and perimeter don't tell which side is which
//           (e.g. the drawn w), but such a model gives the same with w and l swapped.
//           The two parameters still need different sides (e.g. w the long one, l the short one),
//           so that w*l and w+l are the area and half the perimeter of the device.
//
//           The model then gets the area and perimeter of the device, whatever its shape.
//           For parallel devices that LVS combines by adding their areas and perimeters,
//           that's the same as for the single devices, if the model is linear in w*l and w+l.
//           A shape without such a rectangle (perimeter² < 16 · area, e.g. an octagon)
//           gets the square of the same area.
//
//           Not for a varactor: like a MOS gate, its l is the gate length across the poly
//           and its w the gate width along it, and its model depends on them separately
//           (e.g. sky130A cap_var_lvt: the series resistance by w/l along the poly and by l/w
//           through the well, and the edge capacitances by w and by l).
//           With w and l swapped, it's a different device, so its w and l must come from LVS,
//           which sees the poly and the diffusion of the gate.
message LVSAreaPerimeterSide {
    enum Side {
        SIDE_UNSPECIFIED = 0;
        SIDE_LONG = 1;
        SIDE_SHORT = 2;
    }

    // LVS parameter of the area, e.g. "A" (µm²)
    string area_parameter_name = 1;

    // LVS parameter of the perimeter, e.g. "P" (µm)
    string perimeter_parameter_name = 2;

    // which side of the rectangle this parameter is, e.g. the long one for w, the short one for l
    Side side = 3;
}
