syntax = "proto3";

package kpex.tech;

import "kpex/tech/tech_catalog.proto";

// Evidence for a resolved catalog selection. Independent of any particular
// exporter or calibration workflow; catalog/dataset provenance is preserved.
message TechnologySelectionRecord {
    string technology_id = 1;
    string scenario_id = 10;
    string catalog_path = 20; // Origin for audit only; consumers must not fetch it.
    string catalog_sha256 = 30; // SHA256 of exact catalog bytes.
    string catalog_description = 40;
    TechnologyProvenance catalog_provenance = 50;
    string resolved_technology_sha256 = 60; // Deterministic Technology payload.
    SelectedTechnologyDatasets datasets = 70;
    bool physical_stack_matches = 80;
}

message SelectedTechnologyDatasets {
    SelectedDatasetIdentity resistance = 1;
    SelectedDatasetIdentity capacitance = 10;
    SelectedDatasetIdentity process_stack = 20;
    // Absent means unavailable, never inherited from another scenario.
    SelectedDatasetIdentity device_references = 30;
}

message SelectedDatasetIdentity {
    string id = 1;
    string sha256 = 10; // Deterministic dataset payload, excluding provenance.
    TechnologyProvenance provenance = 20;
}
