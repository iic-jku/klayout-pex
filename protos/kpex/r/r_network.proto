syntax = "proto3";

package kpex.r;

import "kpex/layout/location.proto";
import "kpex/layout/device.proto";
import "kpex/layout/pin.proto";

message RNode {
    enum Kind {
        KIND_UNSPECIFIED = 0;
        KIND_PIN = 1;
        KIND_DEVICE_TERMINAL = 2;
        KIND_WIRE_JUNCTION = 3;
        KIND_VIA_JUNCTION = 4;

        // a port of the netlist where a net enters an exclusion block, or a device terminal within it,
        // for the model of the block
        KIND_EXCLUSION_PORT = 5;
    }

    message Via {}
    message WireJunction {}

    uint64 node_id = 10;
    string node_name = 20;
    Kind node_kind = 30;
    string layer_name = 40;
    string net_name = 50;
    kpex.layout.Location location = 60;

    oneof parameters {
        kpex.layout.Pin pin = 90;
        kpex.layout.Device.Terminal device_terminal = 91;
        Via via = 92;
        WireJunction wire_junction = 93;
    }
}

message RNodeRef {
    uint64 node_id = 1;
}

message RElement {
    uint64 element_id = 1;
    RNodeRef node_a = 20;
    RNodeRef node_b = 30;
    double resistance = 40; // in ohm
}

message RNetwork {
    string net_name = 1;
    repeated RNode nodes = 20;
    repeated RElement elements = 30;

    // Of a network of several pieces (nodes no resistors join), the nodes at what joins their piece to the taps,
    // the substrate or a well: LVS has them on one net, and these are no conductors of the network.
    // A piece without such a node has no path to its net
    repeated uint64 substrate_joined_node_ids = 40;

    // The nodes at the cuts of an exclusion block that the shapes within it join, so that the model of the block does:
    // each list is one of these, the taps and wells don't join them then
    message ModelJoin {
        repeated uint64 node_ids = 1;
    }
    repeated ModelJoin model_joins = 50;
}
